name: Example tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Create an isolated environment
        run: python -m venv .venv
      - name: Run examples and tests in the environment
        shell: python
        run: |
          from pathlib import Path
          import os
          import subprocess
          interpreter = Path('.venv') / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          subprocess.run([str(interpreter.resolve()), '-m', 'examples.hello'], check=True)
          subprocess.run([str(interpreter.resolve()), '-m', 'unittest', 'discover', '-s', 'tests', '-v'], check=True)
